services:
  redis:
    image:  harbor.utsp.utwente.nl/library/redis-webanimo-custom:1.0.0
    restart: unless-stopped
    ports:
      - '6379:6379'
  webanimo:
    image:  harbor.utsp.utwente.nl/library/webanimo-uppaal-5.1.0:1.0.0
    ports:
      - '8080:8080'
    environment:
      - animo.config.file.path=/etc/animo/ANIMO_configuration.xml
