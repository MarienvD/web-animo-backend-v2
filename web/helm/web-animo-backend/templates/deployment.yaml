apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quarkus
  template:
    metadata:
      labels:
        app: quarkus
    spec:
      containers:
        - env:
            - name: animo.config.file.path
              value: /etc/animo/ANIMO_configuration.xml
          image: "docker.io/marien99/webanimo-backend:{{ .Chart.AppVersion }}"
          name: quarkus
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
